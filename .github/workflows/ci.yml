name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # `prisma generate` (postinstall) reads DATABASE_URL from prisma.config.ts but never
      # connects; the tests mock Prisma. A placeholder keeps CI away from any real database.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for fallow's hotspot / churn analysis

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Writes coverage/coverage-final.json, which fallow picks up automatically to score
      # complexity against real test coverage (without it, fallow only estimates).
      - name: Test (with coverage)
        run: npm run coverage

      - name: Code health (fallow)
        run: npx fallow
