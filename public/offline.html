<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GradePoints – Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: system-ui, sans-serif;
      padding: 1.5rem env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
      padding-top: calc(env(safe-area-inset-top, 0px) + 1.5rem);
      text-align: center;
      gap: 1rem;
    }
    h1 { font-size: 1.5rem; font-weight: 700; }
    h1 span { color: #3b82f6; }
    p { color: #737373; font-size: 0.95rem; max-width: 280px; line-height: 1.5; }
    button {
      margin-top: 0.5rem;
      padding: 0.6rem 1.5rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
    }
    button:active { background: #1d4ed8; }
  </style>
</head>
<body>
  <h1>Grade<span>Points</span></h1>
  <p>You're offline. Check your connection and try again.</p>
  <button onclick="location.reload()">Retry</button>
</body>
</html>
